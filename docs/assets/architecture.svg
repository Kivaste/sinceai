<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="arch-title arch-desc" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif">
  <title id="arch-title">pets-release architecture: a self-hosted pipeline step</title>
  <desc id="arch-desc">Inside the customer's infrastructure, source storage feeds the pets-release pipeline step, which takes keys from the customer's key store and writes released tables plus a signed manifest for the recipient. The approval and audit console reads the manifest. The only outbound arrow is an optional LLM front end that receives field names only. Row values never leave.</desc>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arch-arrow-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <!-- trust boundary -->
  <rect x="20" y="40" width="720" height="430" rx="18" fill="#f1f5fd" stroke="#2952cc" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="44" y="72" font-size="17" font-weight="700" fill="#2952cc">Customer's own infrastructure</text>
  <text x="44" y="94" font-size="13" fill="#5b6476">self-hosted · nothing runs on our servers</text>

  <!-- key store -->
  <rect x="230" y="110" width="180" height="52" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="320" y="133" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Key store</text>
  <text x="320" y="152" font-size="12" fill="#5b6476" text-anchor="middle">customer-held HMAC keys</text>
  <line x1="320" y1="162" x2="320" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#arch-arrow)"/>

  <!-- storage -->
  <rect x="44" y="210" width="140" height="80" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="114" y="245" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Source storage</text>
  <text x="114" y="265" font-size="12" fill="#5b6476" text-anchor="middle">warehouse / files</text>
  <line x1="184" y1="250" x2="224" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arch-arrow)"/>

  <!-- pets-release step -->
  <rect x="226" y="198" width="188" height="108" rx="12" fill="#2952cc"/>
  <text x="320" y="230" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">pets-release</text>
  <text x="320" y="252" font-size="12" fill="#dbe4ff" text-anchor="middle">pipeline step: CI / Airflow / dbt</text>
  <text x="320" y="276" font-size="12" fill="#fff" text-anchor="middle">exit 0 released · 1 refused</text>
  <text x="320" y="293" font-size="12" fill="#fff" text-anchor="middle">2 bad input</text>
  <line x1="414" y1="250" x2="454" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arch-arrow)"/>

  <!-- released output -->
  <rect x="456" y="198" width="190" height="108" rx="12" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text x="551" y="238" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Released tables</text>
  <text x="551" y="260" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">+ signed manifest</text>
  <text x="551" y="284" font-size="12" fill="#047857" text-anchor="middle">only on exit 0</text>

  <!-- recipient -->
  <line x1="551" y1="306" x2="551" y2="358" stroke="#334155" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <rect x="456" y="360" width="190" height="70" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="551" y="390" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Recipient</text>
  <text x="551" y="410" font-size="12" fill="#5b6476" text-anchor="middle">controlled research environment</text>

  <!-- console -->
  <path d="M470,306 L414,366" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arch-arrow)"/>
  <text x="428" y="330" font-size="12" fill="#5b6476" text-anchor="end">console reads manifest</text>
  <rect x="226" y="360" width="188" height="70" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="320" y="390" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Approval &amp; audit console</text>
  <text x="320" y="410" font-size="12" fill="#5b6476" text-anchor="middle">data protection officer</text>

  <!-- the only outbound arrow -->
  <path d="M400,198 V178 H786" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arch-arrow-out)"/>
  <text x="600" y="170" font-size="12.5" font-weight="600" fill="#b45309" text-anchor="middle">field names only · no row values</text>
  <rect x="790" y="140" width="190" height="78" rx="12" fill="#fff7ed" stroke="#b45309" stroke-dasharray="6 5"/>
  <text x="885" y="172" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">LLM front end</text>
  <text x="885" y="192" font-size="12" fill="#5b6476" text-anchor="middle">optional · opt-in</text>

  <!-- caption -->
  <text x="20" y="508" font-size="18" font-weight="700" fill="#0f172a">Row values never leave the customer's infrastructure.</text>
  <text x="20" y="530" font-size="13" fill="#5b6476">The only outbound arrow is optional and carries field names only.</text>
</svg>
