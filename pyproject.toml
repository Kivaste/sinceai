[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pets-release"
version = "0.1.0"
description = "Purpose-first PETs release tool (offline, deterministic)."
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "jinja2", "jsonschema"]

[project.optional-dependencies]
eval = ["scikit-learn"]
dev = ["pytest", "pytest-xdist", "ruff", "setuptools", "wheel"]

[project.scripts]
pets-release = "pets_release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["**/*.csv", "**/*.json", "**/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["kit: needs the challenge kit (PETS_KIT or the pinned path); FAILS if absent. Run kit-less with -m 'not kit'"]

[tool.ruff]
line-length = 110
