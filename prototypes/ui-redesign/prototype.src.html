<!doctype html>
<!-- PROTOTYPE (throwaway). Question: what should the pets-release demo page look like?
     Three structurally different variants, switchable via ?variant=A|B|C and the floating bottom bar.
     Data: aggregates extracted from the pin-5b260ec privacy manifests by extract_aggregates.py.
     Rows preview uses invented SYNTHETIC rows only. Per-person k figures hidden (D33 pending). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Purpose-first data release</title>
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --ink:#0f172a; --muted:#5b6476; --line:#e3e7ef;
  --brand:#2952cc; --brand-soft:#e8eefc;
  --withheld:#64748b; --pseudo:#7c3aed; --coarse:#d97706; --kept:#059669;
  --met:#047857; --met-bg:#d1fae5; --sac:#92400e; --sac-bg:#fef3c7; --fail:#b91c1c; --fail-bg:#fee2e2; --nm:#475569; --nm-bg:#e2e8f0;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
button{font:inherit;cursor:pointer}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:600;white-space:nowrap}
.st-met{background:var(--met-bg);color:var(--met)} .st-sac{background:var(--sac-bg);color:var(--sac)}
.st-fail{background:var(--fail-bg);color:var(--fail)} .st-nm{background:var(--nm-bg);color:var(--nm)}
.tr{display:inline-block;padding:1px 9px;border-radius:6px;font-size:.8rem;font-weight:600;color:#fff}
.tr-withheld{background:var(--withheld)} .tr-pseudonymised{background:var(--pseudo)} .tr-coarsened{background:var(--coarse)} .tr-kept{background:var(--kept)}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;background:var(--brand);color:#fff}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn:disabled{opacity:.45;cursor:default}
.proto-tag{display:inline-block;background:#fde68a;color:#78350f;font-weight:700;font-size:.75rem;letter-spacing:.04em;padding:2px 8px;border-radius:6px}
.d41{font-size:.85rem;color:var(--muted);border-left:3px solid var(--brand);padding:4px 10px;margin-top:10px;background:var(--brand-soft);border-radius:0 6px 6px 0}
table.rows{border-collapse:collapse;width:100%;font-size:.9rem}
table.rows th,table.rows td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.rows th{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600}
table.rows td.mono{font-family:Consolas,monospace}
/* bars */
.bar-row{display:grid;grid-template-columns:minmax(170px,240px) minmax(140px,1fr) auto;gap:14px;align-items:center;margin:10px 0}
.pb{grid-template-columns:170px minmax(200px,1fr) 235px} .pv{grid-template-columns:170px 1fr 120px}
.scale{position:relative;height:16px;font-size:.72rem;color:var(--muted)}
.scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.bar-track{position:relative;height:22px;background:#eef1f6;border-radius:6px}
.bar-before{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:#cbd5e1}
.bar-after{position:absolute;left:0;top:5px;bottom:5px;border-radius:4px}
.mark{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed}
.mark.th{border-color:#0f172a}.mark.fl{border-color:#b45309}
.mark span{position:absolute;top:-18px;left:-14px;font-size:.7rem;white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* run widget */
.run{display:flex;flex-direction:column;gap:10px}
.run-steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.run-step{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#eef1f6;color:var(--muted);font-weight:600;font-size:.88rem}
.run-step .dot{width:18px;height:18px;border-radius:50%;border:2px solid #94a3b8;display:inline-grid;place-items:center;font-size:.7rem}
.run-step.active{background:var(--brand-soft);color:var(--brand)} .run-step.active .dot{border-color:var(--brand);border-top-color:transparent;animation:spin 1s linear infinite}
.run-step.done{background:var(--met-bg);color:var(--met)} .run-step.done .dot{border-color:var(--met);background:var(--met);color:#fff}
.run-arrow{color:#94a3b8}
.run-now{font-size:.95rem}
.run-now b{font-variant-numeric:tabular-nums}
@keyframes spin{to{transform:rotate(360deg)}}
/* switcher */
#switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 8px 30px rgba(0,0,0,.35);font:600 14px/1 system-ui,sans-serif}
#switcher button{background:#333;color:#fff;border:0;border-radius:50%;width:32px;height:32px;font-size:16px}
#switcher span{padding:0 12px;white-space:nowrap}
#switcher em{font-style:normal;color:#fbbf24}

/* ===== Variant A: guided story ===== */
.A-wrap{max-width:1180px;margin:0 auto;padding:22px 28px 110px}
.A-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px}
.A-brand{font-weight:700;font-size:1.05rem}
.A-stepper{display:flex;gap:0;margin:8px 0 22px}
.A-stepper button{flex:1;border:0;background:none;padding:10px 6px 12px;text-align:left;border-top:4px solid var(--line);color:var(--muted);font-size:.9rem}
.A-stepper button b{display:block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.A-stepper button.on{border-color:var(--brand);color:var(--ink)} .A-stepper button.past{border-color:#9db2ef}
.A-head{font-size:2.3rem;font-weight:750;letter-spacing:-.01em;margin:0 0 6px}
.A-sub{font-size:1.15rem;color:var(--muted);margin:0 0 22px;max-width:900px}
.A-nav{display:flex;justify-content:space-between;margin-top:22px}
.A-grid{display:grid;gap:16px}
.A-stat{font-size:2.6rem;font-weight:750;line-height:1}
.A-runbar{padding:12px 18px}

/* ===== Variant B: narrative report ===== */
.B-shell{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.B-nav{position:sticky;top:0;height:100vh;padding:28px 20px;border-right:1px solid var(--line);background:#fff}
.B-nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600;margin:2px 0}
.B-nav a span{display:block;font-weight:400;font-size:.82rem;color:var(--muted)}
.B-nav a.on{background:var(--brand-soft);color:var(--brand)}
.B-main{padding:34px 48px 120px;max-width:1120px}
.B-sec{padding:28px 0 34px;border-bottom:1px solid var(--line)}
.B-kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:700}
.B-take{font-size:1.6rem;font-weight:700;margin:6px 0 16px;max-width:860px}
details.more{margin-top:14px}
details.more summary{cursor:pointer;color:var(--brand);font-weight:600}
details.more[open] summary{margin-bottom:10px}

/* ===== Variant C: cockpit ===== */
.C-wrap{padding:16px 22px 100px}
.C-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:16px}
.C-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.C-kpi{padding:14px 16px}
.C-kpi .lbl{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.C-kpi .val{font-size:1.75rem;font-weight:750}
.C-kpi .val small{font-size:1rem;color:var(--muted);font-weight:500}
.C-main{display:grid;grid-template-columns:1fr 380px;gap:14px}
.C-tables{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.C-tbl h3{font-size:.95rem;margin-bottom:8px}
.C-tiles{display:flex;flex-wrap:wrap;gap:6px}
.C-tile{border:0;border-radius:8px;padding:6px 10px;color:#fff;font-size:.82rem;font-weight:600}
.C-tile.sel{outline:3px solid var(--ink);outline-offset:2px}
.C-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 0}
.C-tabs button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.C-tabs button.on{color:var(--brand);border-color:var(--brand)}
.C-panel{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:18px 20px}
/* ===== Variant D: console ===== */
.D-wrap{padding:16px 22px 100px;max-width:1560px;margin:0 auto}
.D-head{display:flex;justify-content:space-between;gap:20px;align-items:stretch;margin-bottom:12px}
.D-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.92rem;color:var(--muted)} .D-meta b{color:var(--ink)}
.D-meta code,.D-head code{font-family:Consolas,monospace;background:#eef1f6;padding:0 5px;border-radius:4px;color:var(--ink)}
.D-proofs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.D-proof{background:var(--met-bg);color:var(--met);font-weight:600;font-size:.88rem;padding:3px 10px;border-radius:999px}
.D-headr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:400px}
.D-badge{border-radius:12px;padding:10px 22px;text-align:center;color:#fff;font-weight:600}
.D-badge .big{font-size:1.9rem;font-weight:800;letter-spacing:.06em;line-height:1.1}
.D-badge.ok{background:#047857} .D-badge.bad{background:#b91c1c}
.D-seg{display:inline-flex;align-items:center;gap:4px;background:#eef1f6;border-radius:10px;padding:3px}
.D-seg span{padding:0 6px}
.D-seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-weight:600;color:var(--muted);font-size:.88rem}
.D-seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.D-seg.big button{font-size:1rem;padding:8px 16px}
.D-bar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 18px;margin-bottom:12px;flex-wrap:wrap}
.D-pipe{display:flex;align-items:center;gap:10px}
.D-node{border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-weight:700;background:#fff;display:flex;flex-direction:column}
.D-node span{font-weight:400;font-size:.78rem;color:var(--muted)}
.D-node em{font-style:normal;font-size:.72rem;background:var(--brand);color:#fff;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.D-node.this{border:2px solid var(--brand);background:var(--brand-soft)}
.D-node.off,.D-arrow.off{opacity:.35;text-decoration:line-through}
.D-arrow{font-size:1.3rem;color:#94a3b8}
.D-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.D-refusal{border-color:#fca5a5;background:#fff5f5;margin-bottom:12px}
.D-modes{display:flex;align-items:center;gap:16px;margin:4px 0 14px}
.D-modes .proto-tag{margin-left:auto}
.D-replay summary{cursor:pointer;color:var(--brand);font-weight:600}
.D-replay[open]{flex:1}
.D-arch svg{width:100%;max-width:1000px;height:auto;display:block;margin:0 auto}</style>
</head>
<body>
<div id="app"></div>
<template id="arch-svg"><!--__ARCH__--></template>
<div id="switcher" aria-label="Prototype variant switcher">
  <button id="sw-prev" title="Previous variant (←)">←</button>
  <span id="sw-label"></span>
  <button id="sw-next" title="Next variant (→)">→</button>
</div>
<script>
/*__DATA__*/
</script>
<script>
// ---------- shared plain-language layer ----------
const CHECKS = {
  'H-U2': 'Length of stay by triage level',
  'H-U4': 'Diagnosis mix by municipality',
  'H-U6': '30-day revisit rate by age',
  'H-U7': 'CRP vs temperature',
  'H-U8': 'Arrivals by hour of day',
};
const THRESH = 0.9;
const TABLES = {ed_visits:'ED visits', lab_results:'Lab results', clinical_notes:'Clinical notes', published_weekly_stats:'Published weekly stats'};
const ROLES = {
  direct_identifier:'Names & direct IDs', technical_identifier:'Staff & system IDs', quasi_identifier:'Indirect identifiers',
  sensitive_attribute:'Sensitive health details', free_text:'Free text', record_key:'Record keys', non_sensitive:'Low-risk fields'};
const ROLE_HINT = {
  direct_identifier:'name someone outright', quasi_identifier:'combine to single someone out', free_text:'can hide names and numbers',
  sensitive_attribute:'health facts about a person', technical_identifier:'link to staff systems', record_key:'join tables together', non_sensitive:'low risk alone'};
const COL = {
  arrival_ts:'Arrival time', date_of_birth:'Date of birth', icd10_primary:'Main diagnosis', icd10_secondary:'Secondary diagnosis',
  los_minutes:'Length of stay', municipality:'Municipality', readmit_30d:'Revisit within 30 days', temp_c:'Temperature', triage:'Triage level',
  visit_id:'Visit ID', test_code:'Lab test', value:'Lab value', patient_hetu:'National ID number', patient_name:'Patient name',
  home_address:'Home address', phone:'Phone', postcode:'Postcode', sex:'Sex', chief_complaint:'Chief complaint (text)',
  attending_physician_name:'Doctor name', attending_physician_id:'Doctor ID', ambulance_unit:'Ambulance unit', arrival_mode:'Arrival mode',
  discharge_ts:'Discharge time', disposition:'Discharge outcome', heart_rate:'Heart rate', diastolic_bp:'Blood pressure (dia)',
  systolic_bp:'Blood pressure (sys)', pain_nrs:'Pain score', resp_rate:'Breathing rate', spo2:'Oxygen saturation',
  abnormal_flag:'Abnormal flag', lab_id:'Lab record ID', ref_range:'Reference range', sampled_ts:'Sample time', test_name:'Test name', unit:'Unit',
  author_name:'Author name', author_staff_id:'Author staff ID', language:'Language', note_id:'Note ID', note_text:'Note text', note_type:'Note type',
  written_ts:'Written time', age_band:'Age band', diagnosis_group:'Diagnosis group', stat_id:'Row ID', visits:'Visit count', week:'Week'};
const colName = f => COL[f.column] || f.column.replace(/_/g,' ');
function treatment(f){
  if (f.decision !== 'released') return 'withheld';
  if (f.pet === 'keyed_pseudonym') return 'pseudonymised';
  if (f.pet === 'none') return 'kept';
  return 'coarsened';
}
const TR_LABEL = {withheld:'Withheld', pseudonymised:'Pseudonymised', coarsened:'Coarsened', kept:'Kept as is'};
// per-field plain explanation + which purpose check it serves (derived from the manifest reasons, rewritten for humans)
const RELEASED_WHY = {
  'ed_visits.arrival_ts': ['Exact time → hour of day only. Month + hour still left about 72% of visits in tiny groups.', ['H-U8']],
  'ed_visits.date_of_birth': ['Birth date → 10-year age band (e.g. 40–49).', ['H-U6']],
  'ed_visits.icd10_primary': ['Full code → first 3 characters. The coarser chapter level was tried and broke two research questions.', ['H-U4','H-U7']],
  'ed_visits.los_minutes': ['Exact minutes → ranges (bins).', ['H-U2']],
  'ed_visits.municipality': ['Small municipalities grouped into "other" so no one stands out.', ['H-U4']],
  'ed_visits.readmit_30d': ['Kept: without it the 30-day revisit question fails.', ['H-U6']],
  'ed_visits.temp_c': ['Rounded. Coarser ranges were tried and broke the CRP vs temperature question.', ['H-U7']],
  'ed_visits.triage': ['Kept: without it the length-of-stay question fails.', ['H-U2']],
  'ed_visits.visit_id': ['Replaced by a keyed pseudonym, valid only in this release, so visits still join to lab results.', ['H-U7']],
  'lab_results.visit_id': ['Same pseudonym as in ED visits, so CRP results join to the right visit.', ['H-U7']],
  'lab_results.test_code': ['Kept: needed to find CRP tests.', ['H-U7']],
  'lab_results.value': ['Kept exact: rounding was tried and broke the CRP vs temperature question.', ['H-U7']],
};
function why(f){
  const k = f.table+'.'+f.column;
  if (RELEASED_WHY[k]) return {text:RELEASED_WHY[k][0], serves:RELEASED_WHY[k][1]};
  const r = f.reason || '';
  if (/patient_hetu/.test(f.column)) return {text:'National ID number: never released. The revisit flag answers the 30-day question without it.', serves:[]};
  if (/table withheld/.test(r)) return {text:'Whole table left out: none of the five research questions needs it.', serves:[]};
  if (/direct identifier/.test(r)) return {text:'Names a person directly: never released.', serves:[]};
  if (/free text/.test(r)) return {text:'Free text can hide names and numbers, and no question needs it.', serves:[]};
  if (/municipality suffices/.test(r)) return {text:'Municipality is enough; a postcode would narrow people down.', serves:[]};
  return {text:'No research question needs it, so it was left out: less to leak.', serves:[]};
}
const F = DATA.fields.map(f => Object.assign({}, f, {tr:treatment(f), name:colName(f), why:why(f)}));
const SAC = Object.fromEntries(DATA.sacrifices.map(s => [s.check, s]));
function checkStatus(t){
  if (t.after == null) return {key:'nm', label:'Not measured'};
  if (t.after >= THRESH) return {key:'met', label:'Met'};
  const s = SAC[t.task];
  if (s && t.after >= s.floor) return {key:'sac', label:'Accepted sacrifice (floor '+s.floor.toFixed(1)+')'};
  return {key:'fail', label:'Failed'};
}
const pct = x => x == null ? '–' : Math.round(x*100)+'%';
const n2 = x => x == null ? '–' : x.toFixed(2);
const H = DATA.headline;
const released = F.filter(f => f.tr !== 'withheld');
const GATE_GROUPS = [
  ['contract','Output matches the agreed format'],
  ['producer','No keys, originals or tiny groups left behind'],
  ['release','Package is complete and untampered'],
  ['rescan','Every released cell re-scanned for identifiers'],
  ['text','Text patterns (emails, phones, IDs…) absent'],
].map(([p,label]) => {const cs = DATA.gate.checks.filter(c => c.check.startsWith(p+'.')); return {p,label,total:cs.length,pass:cs.filter(c=>c.status==='pass').length,checks:cs};});
const gatePass = DATA.gate.checks.filter(c=>c.status==='pass').length, gateTotal = DATA.gate.checks.length;
const checkPlain = c => c.split('.')[1].replace(/-/g,' ').replace('person k','small groups (per person)').replace('row k','small groups (per row)');
const LIMITS = [
  ['Accepted sacrifice', 'Diagnosis mix by municipality keeps '+pct(SAC['H-U4'].after)+' of its accuracy (below the usual 90%, above the 60% floor): small municipalities had to be grouped.'],
  ['Not measured', 'Attribute inference (guessing a hidden fact about a known person) has not been measured yet.'],
  ['Pending', 'Per-person group-size figure (k) is pending review and not shown.'],
  ['Still personal data', 'Pseudonymised data is still personal data under GDPR: the recipient must protect it.'],
  ['Scope', 'Fit only for this recipient and purpose. Any other use needs a new release.'],
];
const RECIPIENT = 'University research group', SETTING = 'Controlled research environment', PURPOSE = 'Understand ED crowding and revisits';
const SYN_ED = [
  ['PSEUDO_7f3a','40-49','Town A','2','R50','[120,240)','38.4','14:00','no'],
  ['PSEUDO_c21e','70-79','other','3','J18','[240,480)','39.1','03:00','yes'],
  ['PSEUDO_09bd','20-29','Town B','4','S93','[0,120)','36.8','22:00','no'],
  ['PSEUDO_e5a0','60-69','other','2','I48','[240,480)','37.2','09:00','no'],
];
const SYN_ED_H = ['Visit (pseudonym)','Age band','Municipality','Triage','Diagnosis (3 chars)','Stay (min)','Temp °C','Arrival hour','Revisit 30 d'];
const SYN_LAB = [['PSEUDO_7f3a','CRP','42'],['PSEUDO_c21e','CRP','118'],['PSEUDO_c21e','other','5.1'],['PSEUDO_e5a0','CRP','<5']];
const D41 = 'Synthetic kit data © Since AI ry, CC BY 4.0. In a real deployment only the recipient sees this view.';

// ---------- shared widgets (small, reused; layouts are per-variant) ----------
const el = (html) => {const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild;};
const statusPill = s => `<span class="pill st-${s.key}">${s.label}</span>`;
const trChip = t => `<span class="tr tr-${t}">${TR_LABEL[t]}</span>`;
function purposeBars(){
  const rows = DATA.tasks.map(t => {
    const s = checkStatus(t), col = {met:'var(--met)',sac:'#d97706',fail:'var(--fail)',nm:'#94a3b8'}[s.key];
    return `<div class="bar-row pb"><div><b>${CHECKS[t.task]}</b><div class="small muted">${t.task}</div></div>
      <div class="bar-track"><div class="bar-before" style="width:${(t.before||0)*100}%"></div>
        <div class="bar-after" style="width:${(t.after||0)*100}%;background:${col}"></div>
        <div class="mark th" style="left:90%"></div>
        ${s.key==='sac'?`<div class="mark fl" style="left:60%"></div>`:''}</div>
      <div><b>${pct(t.after)}</b> ${statusPill(s)}</div></div>`;}).join('');
  const scale = `<div class="bar-row pb" style="margin:0"><div></div><div class="scale"><span style="left:60%;color:#b45309">60% floor</span><span style="left:90%">90%</span></div><div></div></div>`;
  return `<div>${scale}${rows}<div class="legend" style="margin-top:12px"><span><i style="background:#cbd5e1"></i>Original data (100%)</span><span><i style="background:var(--met)"></i>Protected release</span><span>Dashed line: target 90% · amber: agreed floor 60% for an accepted sacrifice</span></div></div>`;
}
function privacyBars(){
  const items = [
    ['Privacy score','higher is safer',H.privacy,true],
    ['Linkage attack success','share of people an attacker re-identifies',H.linkage,false],
  ];
  return items.map(([l,h,v,up]) => `<div class="bar-row pv"><div><b>${l}</b><div class="small muted">${h}</div></div>
    <div><div class="bar-track" style="height:14px;margin-bottom:4px"><div class="bar-before" style="width:${v.before*100}%;background:#f87171"></div></div>
    <div class="bar-track" style="height:14px"><div class="bar-before" style="width:${Math.max(v.after*100,0.8)}%;background:var(--met)"></div></div></div>

// run-progress mock (simulated timings)
const RUN_STEPS = [
  {name:'Inventory', ms:2200, now:['Reading the schema of 4 tables, 53 columns…','Sorting columns: direct IDs, indirect IDs, sensitive details…']},
  {name:'Release (search + gate)', ms:6500, now:['Trying step 12 of 45: leave out heart rate…','Trying step 36 of 45: coarsen diagnosis to chapter… rejected, breaks diagnosis mix','Trying step 44 of 45: arrival time → hour of day… kept','Running '+gateTotal+' gate checks on every released cell…']},
  {name:'Recipient verify', ms:2000, now:['Recipient re-checks file fingerprints against the manifest…']},
  {name:'Full verify', ms:3200, now:['Re-running all '+gateTotal+' checks from scratch and checking the signature…']},
];
function runWidget(id){
  return `<div class="run" id="${id}"><div class="run-steps">${RUN_STEPS.map((s,i)=>`${i?'<span class="run-arrow">→</span>':''}<span class="run-step done" data-i="${i}"><span class="dot">✓</span>${s.name}</span>`).join('')}</div>
   <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><button class="btn" data-run>▶ Simulate run</button>
   <div class="run-now" data-now>Last run (pin ${DATA.toolRevision}): all steps finished. <span class="muted small">Timings in this prototype are simulated.</span></div></div></div>`;
}
let runTimer = null;
function wireRun(root){
  root.querySelectorAll('[data-run]').forEach(btn => btn.onclick = () => {
    const box = btn.closest('.run'), steps = [...box.querySelectorAll('.run-step')], now = box.querySelector('[data-now]');
    clearInterval(runTimer); btn.disabled = true;
    steps.forEach(s => {s.className='run-step'; s.querySelector('.dot').textContent='';});
    const t0 = performance.now(); const total = RUN_STEPS.reduce((a,s)=>a+s.ms,0);
    runTimer = setInterval(() => {
      const t = performance.now()-t0; let acc=0, cur=RUN_STEPS.length;
      for (let i=0;i<RUN_STEPS.length;i++){ if (t < acc+RUN_STEPS[i].ms){cur=i;break;} acc+=RUN_STEPS[i].ms; }
      steps.forEach((s,i)=>{ s.className='run-step'+(i<cur?' done':i===cur?' active':''); s.querySelector('.dot').textContent = i<cur?'✓':''; });
      const secs = (Math.min(t,total)/1000).toFixed(1);
      if (cur >= RUN_STEPS.length){ clearInterval(runTimer); btn.disabled=false;
        now.innerHTML = `<b>${secs}s</b> · Done. Gate ${gatePass}/${gateTotal} passed · recipient verify ✓ · full verify ✓`; return; }
      const msgs = RUN_STEPS[cur].now, frac = (t-acc)/RUN_STEPS[cur].ms;
      now.innerHTML = `<b>${secs}s</b> · <b style="color:var(--brand)">${RUN_STEPS[cur].name}</b>: ${msgs[Math.min(msgs.length-1, Math.floor(frac*msgs.length))]}`;
    }, 100);
  });
}

  const tabs = {
    checks:['Research questions', () => purposeBars()],
    privacy:['Privacy measured', () => `<div style="display:grid;grid-template-columns:1.1fr 1fr;gap:24px"><div>${privacyBars()}<p class="small muted">Group-size (k) figures: <b>pending review</b>, not shown.</p></div><div><b>How the release was found</b>${searchChart(460,210)}</div></div>`],
    output:['Output preview', () => rowsPreview()],
    gate:['Safety gate', () => `<div style="columns:2;column-gap:28px">${gateSummary(true)}</div>`],
    limits:['Scope & limits', () => `<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:20px"><div>${limitsList()}</div><div><p>✅ <b>Fit for:</b> ${RECIPIENT}, ${PURPOSE.toLowerCase()}.</p><p>⛔ <b>Not fit for:</b> ${DATA.notFitFor.length} other scenarios.</p></div></div>`],
    arch:['Architecture', () => `<div class="D-arch">${document.getElementById('arch-svg').innerHTML}</div>`],
  };
  const gp = refused ? gatePass - MOCK_REFUSAL.length : gatePass;
  const draw = () => {
    const gp = refused ? gatePass - MOCK_REFUSAL.length : gatePass;
    const badge = refused
      ? `<div class="D-badge bad"><div class="big">REFUSED</div><div>exit 1 · pipeline stopped</div></div>`
      : `<div class="D-badge ok"><div class="big">RELEASED</div><div>exit 0 · published downstream</div></div>`;
    const proofs = refused
      ? `<span class="muted">No manifest published · nothing to verify · nothing left the step</span>`
      : `<span class="D-proof">Manifest signed ✓</span><span class="D-proof">Recipient verify ✓</span><span class="D-proof">Controller verify ✓</span>`;
    const pipe = `<div class="D-pipe"><div class="D-node">Extract<span>upstream job</span></div><div class="D-arrow">→</div>
      <div class="D-node this"><div>pets-release <em>this run</em></div><span>exit 0 → publish · 1 → stop · 2 → bad input</span></div><div class="D-arrow ${refused?'off':''}">→</div>
      <div class="D-node ${refused?'off':''}">Share / export<span>${refused?'skipped: pipeline stopped':'to '+RECIPIENT.toLowerCase()}</span></div></div>`;
    const actions = `<div class="D-actions"><button class="btn" data-act="Approve sharing" ${refused?'disabled':''}>✓ Approve sharing</button><button class="btn ghost" data-act="Hold">⏸ Hold</button><button class="btn ghost" data-act="Download signed manifest" ${refused?'disabled':''}>⬇ Download signed manifest</button>${toast?`<span class="small muted">${toast}</span>`:''}</div>`;
    const refusal = refused ? `<div class="card D-refusal"><span class="proto-tag">MOCK REASONS</span><h3 style="margin-top:8px">Why the pipeline stopped (fail-closed)</h3>
      ${MOCK_REFUSAL.map(r=>`<div style="margin:6px 0"><span class="pill st-fail">Failed</span> <b>${r.label}</b> <span class="muted small">${r.check}</span> · ${r.text}</div>`).join('')}
      <div class="small muted">Nothing was published. Fix the input or the plan and re-run the pipeline.</div></div>` : '';
    const kpi = (l,v,sub,cls='') => `<div class="card C-kpi ${cls}"><div class="lbl">${l}</div><div class="val">${v}</div><div class="small muted">${sub}</div></div>`;
    const kpis = `<div class="C-kpis">${kpi('Privacy',`${pct(H.privacy.before)} → <span style="color:var(--met)">${pct(H.privacy.after)}</span>`,'higher is safer')}
       ${kpi('Research value',`${pct(H.utility.before)} → ${pct(H.utility.after)}`,'average of 5 questions')}
       ${kpi('Linkage attack',`${pct(H.linkage.before)} → <span style="color:var(--met)">${pct(H.linkage.after)}</span>`,'people re-identified')}
       ${kpi('Safety gate',`<span style="color:${refused?'var(--fail)':'inherit'}">${gp}/${gateTotal}</span>`,refused?'checks passed (mock failure)':'checks passed')}
       ${kpi('Research questions',`${DATA.tasks.filter(t=>checkStatus(t).key==='met').length} met · ${DATA.tasks.filter(t=>checkStatus(t).key==='sac').length} sacrifice`,'of 5 · none failed')}</div>`;
    let body;
    if (mode==='walk'){
      const s = STEPS[step];
      body = `<div class="A-stepper">${STEPS.map((x,j)=>`<button data-j="${j}" class="${j===step?'on':j<step?'past':''}"><b>Step ${j+1}</b>${x.t}</button>`).join('')}</div>
        <h1 class="A-head" style="font-size:2rem">${s.head}</h1><p class="A-sub">${s.sub}</p>${s.body()}
        <div class="A-nav"><button class="btn ghost" data-back ${step===0?'disabled':''}>← Back</button>${step<4?`<button class="btn" data-next>Next: ${STEPS[step+1].t} →</button>`:`<button class="btn" data-mode="cockpit">Open the full record →</button>`}</div>`;
    } else {
      const byT = {}; F.forEach(f => (byT[f.table]=byT[f.table]||[]).push(f));
      const order = {kept:0,pseudonymised:1,coarsened:2,withheld:3};
      body = `${kpis}<div class="C-main"><div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="font-size:1.1rem">Field map: what this run did to every column · <span class="muted small">click a tile</span></h2>
       <div class="legend">${['kept','pseudonymised','coarsened','withheld'].map(x=>`<span><i style="background:var(--${x==='pseudonymised'?'pseudo':x==='coarsened'?'coarse':x})"></i>${TR_LABEL[x]}</span>`).join('')}</div></div>
       <div class="C-tables">${Object.keys(TABLES).map(tb=>`<div class="C-tbl"><h3>${TABLES[tb]} <span class="muted small">${byT[tb].filter(f=>f.tr!=='withheld').length}/${byT[tb].length} released</span></h3><div class="C-tiles">
         ${byT[tb].slice().sort((a,b)=>order[a.tr]-order[b.tr]).map(f=>`<button class="C-tile tr-${f.tr} ${f===sel?'sel':''}" data-f="${F.indexOf(f)}">${f.name}</button>`).join('')}</div></div>`).join('')}</div></div>
       <div class="card" style="border-color:var(--brand)"><div class="small muted">${TABLES[sel.table]} · ${ROLES[sel.role]}</div><h2 style="font-size:1.4rem;margin:4px 0 8px">${sel.name}</h2>${trChip(sel.tr)}
         <p style="font-size:1.05rem">${sel.why.text}</p>
         ${sel.why.serves.length?`<div class="small muted">Serves research question</div>${sel.why.serves.map(s=>{const tt=DATA.tasks.find(x=>x.task===s);return `<div style="margin:6px 0"><b>${CHECKS[s]}</b><br>${pct(tt.after)} kept ${statusPill(checkStatus(tt))}</div>`;}).join('')}`:'<div class="small muted">Serves no research question, so it does not leave the step.</div>'}
         ${sel.tr==='pseudonymised'?'<p class="small" style="color:var(--sac)">Still personal data: the recipient must protect it.</p>':''}</div></div>
       <div class="C-tabs">${Object.entries(tabs).map(([k,[l]])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${k==='gate'?l+' '+gp+'/'+gateTotal:l}</button>`).join('')}</div>
       <div class="C-panel">${tabs[tab][1]()}</div>`;
    }
    root.innerHTML = `<header class="D-head card"><div class="D-headl"><div class="B-kicker">Audit record · one pipeline run</div>
        <h1 style="font-size:1.55rem;margin:4px 0 2px">${RUN_ID}</h1>
        <div class="D-meta"><span>Triggered by <b>CI job <code>release-health-s1</code></b> · demo</span><span>Scenario <b>${DATA.scenario}</b></span><span>Recipient <b>${RECIPIENT}</b> (${SETTING.toLowerCase()})</span><span>Purpose <b>${PURPOSE}</b></span><span>Engine pin <code>${DATA.toolRevision}</code></span></div>
        <div class="D-proofs">${proofs}</div></div>
      <div class="D-headr">${badge}<div class="D-seg"><span class="small muted">Prototype state:</span><button data-out="released" class="${refused?'':'on'}">Released</button><button data-out="refused" class="${refused?'on':''}">Refused (mock)</button></div></div></header>
      <div class="D-bar card">${pipe}${actions}</div>
      ${refusal}
      <div class="D-modes"><div class="D-seg big"><button data-mode="cockpit" class="${mode==='cockpit'?'on':''}">Full record</button><button data-mode="walk" class="${mode==='walk'?'on':''}">Walkthrough (5 steps)</button></div>
        <details class="D-replay"><summary>Replay this run</summary><div style="padding-top:8px">${runWidget('runD')}</div></details><span class="proto-tag">PROTOTYPE D · Console</span></div>
      ${body}`;
    const setQ = () => { const u = new URL(location.href); u.searchParams.set('mode', mode==='walk'?'walk':'cockpit'); if(mode==='walk') u.searchParams.set('step', step+1); else ['step','mode','outcome','tab'].forEach(k=>u.searchParams.delete(k));
      if (refused) u.searchParams.set('outcome','refused'); else u.searchParams.delete('outcome'); if(mode==='cockpit') u.searchParams.set('tab',tab); history.replaceState(null,'',u); };
    root.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{sel=F[+b.dataset.f];draw();});
    root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;setQ();draw();});
    root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;setQ();draw();});
    root.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>{refused=b.dataset.out==='refused';toast='';setQ();draw();});
    root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{toast=`Prototype: "${b.dataset.act}" is visual only. Nothing was changed.`;draw();});
    root.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{step=+b.dataset.j;setQ();draw();});
    const bk=root.querySelector('[data-back]'); if(bk) bk.onclick=()=>{if(step>0){step--;setQ();draw();}};
    const nx=root.querySelector('[data-next]'); if(nx) nx.onclick=()=>{if(step<4){step++;setQ();draw();}};
    wireRun(root);
  };
  draw(); return root;
}

// ---------- switcher ----------
const VARIANTS = [['A','Guided story',VariantA],['B','Narrative report',VariantB],['C','Cockpit',VariantC],['D','Console',VariantD]];
function render(){
  const key = (new URLSearchParams(location.search).get('variant')||'A').toUpperCase();
  const v = VARIANTS.find(x=>x[0]===key) || VARIANTS[0];
  clearInterval(runTimer); window.onscroll = null;
  const app = document.getElementById('app'); app.innerHTML=''; app.appendChild(v[2]());
  document.getElementById('sw-label').innerHTML = `<em>${v[0]}</em> (${v[1]})`;
  window.scrollTo(0,0); return v;
}
function go(d){
  const cur = VARIANTS.findIndex(x=>x[0]===((new URLSearchParams(location.search).get('variant')||'A').toUpperCase()));
  const nx = VARIANTS[(Math.max(cur,0)+d+VARIANTS.length)%VARIANTS.length][0];
  const u = new URL(location.href); u.searchParams.set('variant',nx); ['step','mode','outcome','tab'].forEach(k=>u.searchParams.delete(k));
  history.replaceState(null,'',u); render();
}
document.getElementById('sw-prev').onclick=()=>go(-1);
document.getElementById('sw-next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{const t=e.target; if(t.closest&&t.closest('input,textarea,[contenteditable]'))return;
  if(e.key==='ArrowLeft')go(-1); if(e.key==='ArrowRight')go(1);});
render();
</script>
</body>
